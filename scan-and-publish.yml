name: Scan and publish register

on:
  schedule:
    # 07:00 UTC daily. Adjust to your preference; GitHub Actions cron
    # can run several minutes late during high-load periods.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
        run: |
          python main.py \
            --watchlist watchlist.csv \
            --output alerts.csv \
            --json-output site/data/alerts.json

      - name: Upload analyst CSV as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: alerts-csv
          path: alerts.csv
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
